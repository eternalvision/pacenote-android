name: android ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: verify project
        run: ./gradlew :app:koverVerifyDebug lintDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pacenote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
